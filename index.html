<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>おんたまカブカブ</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            terracotta: '#E07A5F',
            sage: '#81B29A',
            bluegrey: '#3D405B',
            cream: '#F4F1DE',
            mustard: '#F2CC8F',
          },
          fontFamily: {
            rounded: ['"M PLUS Rounded 1c"', 'sans-serif'],
            kyokasho: ['"UD Digi Kyokasho N-B"', '"UD デジタル 教科書体 N-B"', '"Klee One"', 'serif'],
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <script>
    Babel.registerPreset('react-classic', {
      presets: [
        [Babel.availablePresets['react'], { "runtime": "classic" }]
      ]
    });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" href="ontamakabukabu.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      height: 100dvh; 
      width: 100vw;
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }
    
    #root {
      height: 100%;
      width: 100%;
    }

    /* コルクボード風背景 */
    .bg-cork {
      background-color: #d0a57b;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
    }

    /* 紙の質感背景 */
    .bg-paper {
      background-color: #F4F1DE;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    }

    /* マスキングテープ装飾 */
    .masking-tape {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 120px;
      height: 30px;
      background-color: rgba(129, 178, 154, 0.7);
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      z-index: 10;
      border-left: 2px dotted rgba(255,255,255,0.6);
      border-right: 2px dotted rgba(255,255,255,0.6);
    }
    
    .masking-tape-terracotta { background-color: rgba(224, 122, 95, 0.7); transform: translateX(-50%) rotate(3deg); }
    .masking-tape-mustard { background-color: rgba(242, 204, 143, 0.7); transform: translateX(-50%) rotate(-1deg); }
    .masking-tape-sage { background-color: rgba(129, 178, 154, 0.9); transform: translateX(-50%) rotate(1deg); }

    /* アニメーション */
    @keyframes openNote {
      0% { transform: translateY(20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .animate-open-note {
      animation: openNote 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop-in { animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    
    /* グラフ用Canvas */
    canvas {
      width: 100%;
      height: 100%;
      background-color: white;
      border-radius: 0.5rem;
    }

    /* スクロールバー非表示設定 */
    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react-classic">
    const { useState, useEffect, useRef } = React;

    // 10社のデータ定義と変動アルゴリズムのパラメータ（★dividend: 配当金を追加）
    const stockInfo = {
      ontama: { id: 1, name: 'おんたま社', desc: 'あまり ねだんが かわらない。あんしん。', color: '#81B29A', icon: '🥚', basePrice: 100, trendCycle: 40, trendAmp: 20, waveCycle: 10, waveAmp: 10, noise: 5, dividend: 2 },
      gosho: { id: 2, name: 'ブルベリカンパニー', desc: 'ふつうの かいしゃ。すこし ねだんが うごく。', color: '#3D405B', icon: '🎒', basePrice: 200, trendCycle: 30, trendAmp: 40, waveCycle: 14, waveAmp: 20, noise: 10, dividend: 4 },
      vegetable: { id: 3, name: 'まほうのやさい', desc: 'ねだんが はげしく うごく！あぶないかも？', color: '#E07A5F', icon: '🥦', basePrice: 80, trendCycle: 20, trendAmp: 40, waveCycle: 6, waveAmp: 30, noise: 20, dividend: 0 },
      terracotta: { id: 4, name: 'りんご文具', desc: 'ながい じかんをかけて ゆっくり うごく。', color: '#d97757', icon: '✏️', basePrice: 150, trendCycle: 100, trendAmp: 80, waveCycle: 20, waveAmp: 10, noise: 5, dividend: 3 },
      sagefarm: { id: 5, name: 'パンダ農園', desc: '上がったり 下がったりが わかりやすい。', color: '#72a88e', icon: '🌿', basePrice: 120, trendCycle: 28, trendAmp: 10, waveCycle: 8, waveAmp: 40, noise: 5, dividend: 3 },
      mustard: { id: 6, name: 'パイン商事', desc: 'あんていしているが、たまに すごく 高くなる！', color: '#eabf7b', icon: '🏢', basePrice: 300, trendCycle: 60, trendAmp: 30, waveCycle: 18, waveAmp: 20, noise: 10, dividend: 5 }, 
      blue: { id: 7, name: 'レモン工業', desc: 'ねだんが 高い。でも あまり うごかない。', color: '#2a2c42', icon: '⚙️', basePrice: 800, trendCycle: 80, trendAmp: 80, waveCycle: 24, waveAmp: 40, noise: 15, dividend: 15 },
      cream: { id: 8, name: 'オレンジ出版', desc: 'やすい から はじめてでも 買いやすい。', color: '#bfae83', icon: '📚', basePrice: 40, trendCycle: 40, trendAmp: 15, waveCycle: 12, waveAmp: 10, noise: 5, dividend: 1 },
      hotspring: { id: 9, name: 'わくわく温泉', desc: 'どう うごくか まったく わからない！', color: '#ff7b7b', icon: '♨️', basePrice: 250, trendCycle: 14, trendAmp: 60, waveCycle: 5, waveAmp: 60, noise: 80, dividend: 0 },
      miracle: { id: 10, name: 'ミラクル・トイ', desc: 'すごく 高い！ お金もち むけ の かぶ。', color: '#9b5de5', icon: '🧸', basePrice: 1500, trendCycle: 90, trendAmp: 400, waveCycle: 30, waveAmp: 150, noise: 50, dividend: 50 }, // ★高配当
      // ★おんたま平均：上の10社の「ふだんの ねだん からの 上がり下がり」の へいきん
      index: { id: 11, name: 'おんたま平均', desc: '10社 ぜんぶの へいきん。ばらばらに 買うより うごきが おだやか。', color: '#b8860b', icon: '🧺', basePrice: 300, isIndex: true, dividend: 3 }
    };

    const companyKeys = Object.keys(stockInfo).filter(key => !stockInfo[key].isIndex);

   const getStepFromDate = (date) => {
      const baseDate = new Date(2024, 0, 1); 
      const diffTime = date.getTime() - baseDate.getTime();
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const isAfternoon = date.getHours() >= 12;
      return diffDays * 2 + (isAfternoon ? 1 : 0);
    };

    const calculatePrice = (stockKey, step) => {
      const info = stockInfo[stockKey];

      if (info.isIndex) {
        // 各社の「いまのねだん ÷ ふだんのねだん」を へいきんして、basePrice をかける
        const ratioSum = companyKeys.reduce((sum, key) => sum + calculatePrice(key, step) / stockInfo[key].basePrice, 0);
        return Math.max(5, Math.round(info.basePrice * ratioSum / companyKeys.length));
      }

      const noiseFunc = (s) => {
        let x = Math.sin(info.id * 1234.5678 + s * 9876.5432) * 10000;
        return (x - Math.floor(x)) * 2 - 1.0;
      };

      const trend = Math.sin(step * (Math.PI * 2 / info.trendCycle)) * info.trendAmp;
      const wave = Math.sin(step * (Math.PI * 2 / info.waveCycle)) * info.waveAmp;
      const noise = noiseFunc(step) * info.noise;

      let price = Math.floor(info.basePrice + trend + wave + noise);

      if (stockKey === 'mustard' && noiseFunc(step * 1.13) > 0.85) {
        price += 400; 
      }

      if (price < 5) price = 5;
      
      return price;
    };

    const App = () => {
      const [gameState, setGameState] = useState('TITLE'); 
      const [isLoading, setIsLoading] = useState(true);
      
      const [score, setScore] = useState(0); 
      const [coin, setCoin] = useState(0);   
      
      const initialPortfolio = Object.keys(stockInfo).reduce((acc, key) => {
        acc[key] = { qty: 0, avgPrice: 0 };
        return acc;
      }, {});
      const [portfolio, setPortfolio] = useState(initialPortfolio);

      const [selectedStock, setSelectedStock] = useState('ontama');
      const [message, setMessage] = useState('');
      
      const [currentDate, setCurrentDate] = useState(new Date());
      const [currentStep, setCurrentStep] = useState(getStepFromDate(new Date()));
      const [historyData, setHistoryData] = useState([]); 

      // ★売買モーダル用のステート（mode: 'BUY' か 'SELL'）
      const [tradeModalInfo, setTradeModalInfo] = useState({ isOpen: false, mode: 'SELL', stockKey: null, maxQty: 0 });
      const [tradeAmount, setTradeAmount] = useState(1);
      const [sellAllModalOpen, setSellAllModalOpen] = useState(false);

      const canvasRef = useRef(null);
      const tabContainerRef = useRef(null);
      const messageTimerRef = useRef(null);
      const [canvasSizeKey, setCanvasSizeKey] = useState(0);

      const [touchStartPos, setTouchStartPos] = useState({ x: null, y: null });
      const [touchEndPos, setTouchEndPos] = useState({ x: null, y: null });

      // 画面サイズが変わったらグラフをかきなおす
      useEffect(() => {
        const onResize = () => setCanvasSizeKey(k => k + 1);
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      // 半日ごとに ねだんを 更新する
      useEffect(() => {
        const timer = setInterval(() => {
          const now = new Date();
          const step = getStepFromDate(now);
          setCurrentStep(prevStep => {
            if (step !== prevStep) setCurrentDate(now);
            return step;
          });
        }, 60000);
        return () => {
          clearInterval(timer);
          clearTimeout(messageTimerRef.current);
        };
      }, []);

      useEffect(() => {
        const loadData = () => {
          const savedScore = parseInt(localStorage.getItem('gogo_drill_score') || '0', 10);
          const savedCoin = parseInt(localStorage.getItem('ontama_coin') || '0', 10);
          const savedPortfolioStr = localStorage.getItem('ontama_portfolio');
          
          if (savedPortfolioStr) {
            const parsed = JSON.parse(savedPortfolioStr);
            const mergedPortfolio = { ...initialPortfolio };
            
            Object.keys(parsed).forEach(key => {
              if (typeof parsed[key] === 'number') {
                mergedPortfolio[key] = { qty: parsed[key], avgPrice: stockInfo[key] ? stockInfo[key].basePrice : 0 };
              } else if (parsed[key]) {
                mergedPortfolio[key] = parsed[key];
              }
            });
            setPortfolio(mergedPortfolio);
          }
          
          setScore(savedScore);
          setCoin(savedCoin);
          
          setTimeout(() => setIsLoading(false), 500);
        };
        
        loadData();
      }, []);

      useEffect(() => {
        const newHistory = [];
        const pastSteps = 14; 
        
        for (let i = currentStep - pastSteps; i <= currentStep; i++) {
          newHistory.push({
            step: i,
            price: calculatePrice(selectedStock, i)
          });
        }
        setHistoryData(newHistory);
      }, [currentStep, selectedStock]);

      // ★はいとうきん：前回チェックした日より後の「10日・20日」の回数ぶん まとめて はらう
      // （アプリを ひらいていない日に 10日・20日 が すぎても もらいそびれない）
      useEffect(() => {
        if (isLoading) return;

        const toDayStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const fromDayStr = (s) => {
          const [y, m, d] = s.split('-').map(Number);
          return new Date(y, m - 1, d);
        };
        const isPayDay = (d) => d.getDate() === 10 || d.getDate() === 20;

        const today = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate());
        const todayStr = toDayStr(today);
        let lastCheckedStr = localStorage.getItem('ontama_dividend_checked');

        if (!lastCheckedStr) {
          // 前のバージョンからの いこう：きょうが 配当日で まだ もらっていなければ、きょうの ぶん だけ はらう
          const legacyTodayStr = `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;
          const alreadyPaidToday = localStorage.getItem('ontama_last_dividend') === legacyTodayStr;
          const yesterday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);
          lastCheckedStr = (isPayDay(today) && !alreadyPaidToday) ? toDayStr(yesterday) : todayStr;
        }

        if (lastCheckedStr >= todayStr) {
          localStorage.setItem('ontama_dividend_checked', todayStr);
          return;
        }

        let payDays = 0;
        const d = fromDayStr(lastCheckedStr);
        d.setDate(d.getDate() + 1);
        for (let guard = 0; d <= today && guard < 3700; guard++) {
          if (isPayDay(d)) payDays++;
          d.setDate(d.getDate() + 1);
        }
        localStorage.setItem('ontama_dividend_checked', todayStr);

        if (payDays === 0) return;

        let perPayDay = 0;
        Object.keys(portfolio).forEach(key => {
          const qty = portfolio[key].qty;
          if (qty > 0 && stockInfo[key] && stockInfo[key].dividend > 0) {
            perPayDay += qty * stockInfo[key].dividend;
          }
        });
        const totalDividend = perPayDay * payDays;

        if (totalDividend > 0) {
          setCoin(prevCoin => {
            const newCoin = prevCoin + totalDividend;
            localStorage.setItem('ontama_coin', newCoin.toString());
            return newCoin;
          });
          const timesText = payDays > 1 ? `（${payDays}回ぶん）` : '';
          showMessage(`🎁 会社から「はいとうきん」${timesText}として\n${totalDividend.toLocaleString()} コイン もらったよ！`);
        }
      }, [currentDate, portfolio, isLoading]);

      useEffect(() => {
        if (gameState === 'MARKET' && tabContainerRef.current) {
          const selectedBtn = tabContainerRef.current.querySelector(`[data-key="${selectedStock}"]`);
          if (selectedBtn) {
            selectedBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
          }
        }
      }, [selectedStock, gameState]);

      const updateAssets = (newScore, newCoin) => {
        setScore(newScore);
        setCoin(newCoin);
        localStorage.setItem('gogo_drill_score', newScore.toString());
        localStorage.setItem('ontama_coin', newCoin.toString());
      };

      const updatePortfolio = (newPortfolio) => {
        setPortfolio(newPortfolio);
        localStorage.setItem('ontama_portfolio', JSON.stringify(newPortfolio));
      };

      const showMessage = (text) => {
        // 前のタイマーを止めてから 出しなおす（つづけて出したメッセージが すぐ消えないように）
        clearTimeout(messageTimerRef.current);
        setMessage(text);
        messageTimerRef.current = setTimeout(() => setMessage(''), 3500);
      };

      const exchange = (amount, type) => {
        if (type === 'TO_COIN') {
          if (score >= amount) {
            updateAssets(score - amount, coin + amount);
            showMessage(`✨ ${amount}スコア を コインに かえたよ！ ✨`);
          } else {
            showMessage('❌ スコアが たりないよ！');
          }
        } else {
          if (coin >= amount) {
            updateAssets(score + amount, coin - amount);
            showMessage(`✨ ${amount}コイン を スコアに かえたよ！ ✨`);
          } else {
            showMessage('❌ コインが たりないよ！');
          }
        }
      };

      const currentPrice = historyData.length > 0 ? historyData[historyData.length - 1].price : 0;
      const prevPrice = historyData.length > 1 ? historyData[historyData.length - 2].price : currentPrice;
      const priceDiff = currentPrice - prevPrice;

      // ★買うモーダルを開く関数（いくつ買うか えらべる）
      const openBuyModal = (key) => {
        const price = calculatePrice(key, currentStep);
        const maxQty = Math.floor(coin / price);
        if (maxQty <= 0) {
          showMessage('❌ コインが たりないよ！');
          return;
        }
        setTradeModalInfo({ isOpen: true, mode: 'BUY', stockKey: key, maxQty });
        setTradeAmount(1);
      };

      // ★売るモーダルを開く関数
      const openSellModal = (key, initialAmount = 1) => {
        const p = portfolio[key];
        if (p.qty <= 0) {
          showMessage('❌ この かぶ は もっていないよ！');
          return;
        }
        setTradeModalInfo({ isOpen: true, mode: 'SELL', stockKey: key, maxQty: p.qty });
        // 初期値が持っている数を超えないようにする
        setTradeAmount(initialAmount > p.qty ? p.qty : initialAmount);
      };

      const closeTradeModal = () => {
        setTradeModalInfo({ isOpen: false, mode: 'SELL', stockKey: null, maxQty: 0 });
      };

      const executeBuy = () => {
        const key = tradeModalInfo.stockKey;
        const amount = tradeAmount;
        const price = calculatePrice(key, currentStep);
        const cost = price * amount;

        if (amount > 0 && coin >= cost) {
          updateAssets(score, coin - cost);
          const p = portfolio[key];
          const newQty = p.qty + amount;
          const newAvgPrice = Math.floor(((p.qty * p.avgPrice) + cost) / newQty);

          const newPort = { ...portfolio, [key]: { qty: newQty, avgPrice: newAvgPrice } };
          updatePortfolio(newPort);
          showMessage(`🛒 ${stockInfo[key].name} を ${amount}かぶ 買ったよ！`);
        } else {
          showMessage('❌ コインが たりないよ！');
        }
        closeTradeModal();
      };

      // ★実際に売却を実行する関数
      const executeSell = () => {
        const key = tradeModalInfo.stockKey;
        const amount = tradeAmount;
        const p = portfolio[key];

        if (p.qty >= amount) {
          const price = calculatePrice(key, currentStep);
          const revenue = price * amount;

          updateAssets(score, coin + revenue);
          const newQty = p.qty - amount;
          const newAvgPrice = newQty === 0 ? 0 : p.avgPrice;

          const newPort = { ...portfolio, [key]: { qty: newQty, avgPrice: newAvgPrice } };
          updatePortfolio(newPort);
          showMessage(`💰 ${stockInfo[key].name} を ${amount}かぶ 売って\n${revenue.toLocaleString()} コイン になったよ！`);
        }
        closeTradeModal();
      };

      // ★全部売却モーダルの実行関数
      const executeSellAll = () => {
        let totalRevenue = 0;
        const currentPortfolio = { ...portfolio };
        let soldCount = 0;
        
        Object.keys(currentPortfolio).forEach(key => {
          const qty = currentPortfolio[key].qty;
          if (qty > 0) {
            const price = calculatePrice(key, currentStep);
            totalRevenue += qty * price;
            currentPortfolio[key] = { qty: 0, avgPrice: 0 };
            soldCount++;
          }
        });
        
        if (soldCount > 0) {
          updateAssets(score, coin + totalRevenue);
          updatePortfolio(currentPortfolio);
          showMessage(`🎉 ぜんぶ売って ${totalRevenue.toLocaleString()} コイン になったよ！`);
        } else {
          showMessage('❌ うれる かぶを もっていないよ！');
        }
        setSellAllModalOpen(false);
      };

      // スワイプ判定
      const handleTouchStart = (e) => {
        // モーダルが開いている時はスワイプさせない
        if (tradeModalInfo.isOpen || sellAllModalOpen) return;
        setTouchEndPos({ x: null, y: null });
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        setTouchStartPos({ x: clientX, y: clientY });
      };

      const handleTouchMove = (e) => {
        if (touchStartPos.x === null || tradeModalInfo.isOpen || sellAllModalOpen) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        setTouchEndPos({ x: clientX, y: clientY });
      };

      const handleTouchEnd = () => {
        if (touchStartPos.x === null || touchEndPos.x === null || tradeModalInfo.isOpen || sellAllModalOpen) {
          setTouchStartPos({ x: null, y: null });
          setTouchEndPos({ x: null, y: null });
          return;
        }
        
        const distanceX = touchStartPos.x - touchEndPos.x;
        const distanceY = touchStartPos.y - touchEndPos.y;
        const swipeThreshold = 50; 
        
        if (Math.abs(distanceX) > Math.abs(distanceY) && Math.abs(distanceX) > swipeThreshold) {
          const keys = Object.keys(stockInfo);
          const currentIndex = keys.indexOf(selectedStock);
          
          if (distanceX > 0) {
            const nextIndex = (currentIndex + 1) % keys.length;
            setSelectedStock(keys[nextIndex]);
          } else {
            const prevIndex = (currentIndex - 1 + keys.length) % keys.length;
            setSelectedStock(keys[prevIndex]);
          }
        }
        
        setTouchStartPos({ x: null, y: null });
        setTouchEndPos({ x: null, y: null });
      };

      // グラフ描画
      useEffect(() => {
        if (gameState !== 'MARKET' || !canvasRef.current || historyData.length === 0) return;
        
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        // 高画素スマホでも くっきり表示する
        const dpr = window.devicePixelRatio || 1;
        const width = canvas.offsetWidth;
        const height = canvas.offsetHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        ctx.clearRect(0, 0, width, height);
        
        ctx.strokeStyle = '#e5e7eb';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let i=1; i<5; i++) {
          const y = (height / 5) * i;
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
        }
        
        for(let i=0; i<historyData.length; i++) {
          if (i % 2 === 0) {
            const x = (width / (historyData.length - 1)) * i;
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
          }
        }
        ctx.stroke();

        const prices = historyData.map(d => d.price);
        let maxVal = Math.max(...prices);
        let minVal = Math.min(...prices);
        if (maxVal === minVal) {
          maxVal += 10;
          minVal = Math.max(0, minVal - 10);
        }
        
        let valRange = maxVal - minVal;
        
        const minRange = stockInfo[selectedStock].basePrice * 0.4; 
        if (valRange < minRange) {
          valRange = minRange;
        }
        
        const displayMin = Math.max(0, minVal - valRange * 0.2); 
        const displayMax = maxVal + valRange * 0.2; 
        const renderRange = displayMax - displayMin; 
        
        const stepX = width / (prices.length - 1);
        
        ctx.beginPath();
        ctx.strokeStyle = stockInfo[selectedStock].color;
        ctx.lineWidth = 4;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        
        prices.forEach((val, i) => {
          const x = i * stepX;
          const y = height - ((val - displayMin) / renderRange) * height;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        const lastVal = prices[prices.length - 1];
        const lastX = (prices.length - 1) * stepX;
        const lastY = height - ((lastVal - displayMin) / renderRange) * height;
        
        ctx.beginPath();
        ctx.fillStyle = stockInfo[selectedStock].color;
        ctx.arc(lastX, lastY, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = stockInfo[selectedStock].color;
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`${lastVal}`, lastX - 10, lastY + 5);

        ctx.fillStyle = '#9ca3af';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('1しゅうかん前', 5, height - 5);
        ctx.textAlign = 'right';
        ctx.fillText('いま', width - 5, height - 5);

                              <button 
                                onClick={() => openSellModal(key, qty)}
                                className="bg-sage text-white px-2 py-1.5 rounded-md text-[9px] sm:text-xs font-bold shadow-sm active:scale-95 transition-transform w-full text-center"
                              >
                                💰 このかぶを売る
                              </button>
                            </div>
                          </div>
                          
                        </div>
                      )
                    })
                  )}
                </div>

                {ownedStocks.length > 0 && (
                  <div className="shrink-0 mt-2 pt-3 border-t-2 border-gray-200 border-dashed">
                    <button 
                      onClick={() => setSellAllModalOpen(true)}
                      className="w-full bg-mustard text-bluegrey py-3 rounded-xl font-bold shadow-sm active:translate-y-1 text-sm sm:text-base border-2 border-white"
                    >
                      もっている 全てのかぶ を 売る！
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {gameState === 'TUTORIAL' && (
            <div className="w-full h-full flex flex-col items-center">
              <button onClick={() => setGameState('TITLE')} className="self-start bg-white/90 text-bluegrey px-4 py-1.5 rounded-full text-sm font-bold shadow-sm mb-2">
                ← もどる
              </button>
              
              <div className="w-full max-w-2xl flex-1 flex flex-col bg-paper rounded-lg shadow-xl p-2 sm:p-4 relative animate-open-note border border-white overflow-hidden">
                <div className="masking-tape masking-tape-mustard"></div>
                <h2 className="text-2xl font-bold text-center text-bluegrey mb-2 mt-6 shrink-0">📖 つかいかた</h2>
                
                <div className="flex-1 overflow-y-auto pb-4 px-4 pt-4">
                  
                  <div className="bg-white p-4 rounded-xl shadow-sm border-2 border-sage mb-6 relative">
                    <div className="absolute -top-4 -left-3 w-8 h-8 bg-sage text-white rounded-full flex items-center justify-center font-bold text-xl border-2 border-white shadow-sm z-10">1</div>
                    <h3 className="font-bold text-lg text-sage mb-2 pl-3">コインを じゅんび しよう！</h3>
                    <p className="text-sm text-gray-700 mb-3 pl-3">「りょうがえじょ」で、ドリルでためたスコアを コイン にかえよう。</p>
                    <div className="flex justify-center items-center gap-4 bg-gray-50 py-3 rounded-lg border border-gray-100 mx-1 sm:mx-3">
                      <div className="text-center">
                         <p className="text-xs text-gray-500 font-bold">スコア</p>
                         <p className="text-2xl font-bold text-sage">100</p>
                      </div>
                      <span className="text-2xl text-gray-400 font-bold">➡</span>
                      <div className="text-center">
                         <p className="text-xs text-gray-500 font-bold">コイン</p>
                         <p className="text-2xl font-bold text-terracotta">100</p>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-xl shadow-sm border-2 border-terracotta mb-6 relative">
                    <div className="absolute -top-4 -left-3 w-8 h-8 bg-terracotta text-white rounded-full flex items-center justify-center font-bold text-xl border-2 border-white shadow-sm z-10">2</div>
                    <h3 className="font-bold text-lg text-terracotta mb-2 pl-3">「かぶ」を 買ってみよう！</h3>
                    <p className="text-sm text-gray-700 mb-3 pl-3">「マーケット」で会社をえらんで かぶ を買おう。いくつ買うかも えらべるよ。ねだんは <b>１日に２回（ごぜん・ごご）</b> かわるよ。</p>
                    <div className="flex justify-around items-center bg-gray-50 py-3 rounded-lg border border-gray-100 mx-1 sm:mx-3">
                      <div className="text-center">
                        <span className="text-3xl">🥚</span>
                        <p className="text-[10px] font-bold text-gray-600 mt-1">あんしん</p>
                      </div>
                      <div className="text-center">
                        <span className="text-3xl">🎒</span>
                        <p className="text-[10px] font-bold text-gray-600 mt-1">ふつう</p>
                      </div>
                      <div className="text-center">
                        <span className="text-3xl">🥦</span>
                        <p className="text-[10px] font-bold text-red-500 mt-1">ドキドキ!</p>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-xl shadow-sm border-2 border-bluegrey mb-6 relative">
                    <div className="absolute -top-4 -left-3 w-8 h-8 bg-bluegrey text-white rounded-full flex items-center justify-center font-bold text-xl border-2 border-white shadow-sm z-10">3</div>
                    <h3 className="font-bold text-lg text-bluegrey mb-2 pl-3">ねだんが 上がったら 売ろう！</h3>
                    <p className="text-sm text-gray-700 mb-3 pl-3"><b>「買ったときのねだん」</b> より <b>「いまのねだん」が高いとき</b> に売ると、コインがふえるよ！ （ポートフォリオ画面で「＋（プラス）」か「－（マイナス）」かがわかるよ）</p>
                    
                    <div className="flex items-center gap-3 bg-red-50 p-3 rounded-lg border border-red-100 mx-1 sm:mx-3">
                      <span className="text-2xl sm:text-3xl">⚠️</span>
                      <p className="text-xs sm:text-sm text-red-600 font-bold leading-tight">ねだんが 下がったときに売ると、コインが へっちゃうから 気をつけてね！</p>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-xl shadow-sm border-2 border-mustard mb-6 relative">
                    <div className="absolute -top-4 -left-3 w-8 h-8 bg-mustard text-white rounded-full flex items-center justify-center font-bold text-xl border-2 border-white shadow-sm z-10">4</div>
                    <h3 className="font-bold text-lg text-yellow-600 mb-2 pl-3">はいとうきん（ボーナス）！</h3>
                    <p className="text-sm text-gray-700 mb-3 pl-3">毎月 <b>10日</b> と <b>20日</b> に、持っている かぶ の数だけ「はいとうきん」がもらえるよ！ 高いかぶほど、たくさんもらえるかも？ （アプリを ひらかなかった日の ぶんも、つぎに ひらいたときに もらえるよ）</p>
                    <div className="flex justify-center items-center gap-2 bg-yellow-50 py-3 rounded-lg border border-yellow-100 mx-1 sm:mx-3 text-center">
                      <span className="text-3xl">🧸</span>
                      <span className="text-xl font-bold text-yellow-600">＋</span>
                      <span className="text-3xl">🎁</span>
                      <span className="text-xl font-bold text-yellow-600">＝</span>
                      <span className="text-3xl">💰</span>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-xl shadow-sm border-2 mb-2 relative" style={{ borderColor: '#b8860b' }}>
                    <div className="absolute -top-4 -left-3 w-8 h-8 text-white rounded-full flex items-center justify-center font-bold text-xl border-2 border-white shadow-sm z-10" style={{ backgroundColor: '#b8860b' }}>5</div>
                    <h3 className="font-bold text-lg mb-2 pl-3" style={{ color: '#b8860b' }}>🧺 おんたま平均ってなに？</h3>
                    <p className="text-sm text-gray-700 mb-3 pl-3">10社 ぜんぶの ねだんの <b>へいきん</b> の かぶ だよ。どこかの会社が 下がっても、ほかの会社が 上がれば うめあわせ できるから、<b>ねだんの うごきが おだやか</b> なんだ。</p>
                    <div className="flex justify-center items-center gap-2 py-3 rounded-lg border mx-1 sm:mx-3 text-center" style={{ backgroundColor: '#fdf8e8', borderColor: '#f0e2b6' }}>
                      <span className="text-2xl">🥚🎒🥦✏️🌿</span>
                      <span className="text-xl font-bold" style={{ color: '#b8860b' }}>➡</span>
                      <span className="text-3xl">🧺</span>
                    </div>
                    <p className="text-[11px] text-gray-500 font-bold mt-2 pl-3">「たまごは ひとつの カゴに もるな」＝ いろいろに 分けておくと あんしん、という ことわざ だよ。</p>
                  </div>

                </div>
              </div>
            </div>
          )}

          {/* ★売買モーダル（買う・売る どちらも いくつ か えらべる） */}
          {tradeModalInfo.isOpen && (() => {
            const info = stockInfo[tradeModalInfo.stockKey];
            const isBuy = tradeModalInfo.mode === 'BUY';
            const price = calculatePrice(tradeModalInfo.stockKey, currentStep);
            const maxQty = tradeModalInfo.maxQty;
            const total = price * tradeAmount;
            const quickAmounts = [1, 5, 10].filter(n => n < maxQty);
            const accentClass = isBuy ? 'bg-terracotta' : 'bg-sage';
            return (
              <div className="absolute inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={closeTradeModal}>
                <div className="bg-white p-5 rounded-2xl shadow-2xl w-full max-w-sm relative animate-pop-in border-4" style={{ borderColor: info.color }} onClick={(e) => e.stopPropagation()}>
                  <h3 className="text-xl font-bold text-center mb-1" style={{ color: info.color }}>
                    {info.icon} {info.name} を {isBuy ? '買う' : '売る'}
                  </h3>
                  <p className="text-center text-xs text-gray-500 font-bold mb-3">1かぶ {price.toLocaleString()} C</p>

                  <p className="text-center text-gray-600 font-bold mb-2">いくつ {isBuy ? 'かう' : 'うる'}？</p>

                  <div className="flex items-center justify-center gap-4 mb-3">
                    <button
                      onClick={() => setTradeAmount(Math.max(1, tradeAmount - 1))}
                      className="w-11 h-11 rounded-full bg-gray-200 text-xl font-bold active:scale-95 text-gray-600 flex items-center justify-center"
                    >－</button>
                    <div className="text-4xl font-bold text-bluegrey w-20 text-center">{tradeAmount}</div>
                    <button
                      onClick={() => setTradeAmount(Math.min(maxQty, tradeAmount + 1))}
                      className="w-11 h-11 rounded-full bg-gray-200 text-xl font-bold active:scale-95 text-gray-600 flex items-center justify-center"
                    >＋</button>
                  </div>

                  <div className="flex justify-center gap-2 mb-3">
                    {quickAmounts.map(n => (
                      <button
                        key={n}
                        onClick={() => setTradeAmount(n)}
                        className={`px-3 py-1 rounded-full text-sm font-bold border-2 active:scale-95 transition-transform ${tradeAmount === n ? `${accentClass} text-white border-transparent` : 'bg-white text-gray-600 border-gray-200'}`}
                      >{n}</button>
                    ))}
                    <button
                      onClick={() => setTradeAmount(maxQty)}
                      className={`px-3 py-1 rounded-full text-sm font-bold border-2 active:scale-95 transition-transform ${tradeAmount === maxQty ? `${accentClass} text-white border-transparent` : 'bg-white text-gray-600 border-gray-200'}`}
                    >{isBuy ? `めいっぱい(${maxQty})` : `ぜんぶ(${maxQty})`}</button>
                  </div>

                  {maxQty > 1 && (
                    <div className="px-2 mb-4">
                      <input
                        type="range"
                        min="1"
                        max={maxQty}
                        value={tradeAmount}
                        onChange={(e) => setTradeAmount(parseInt(e.target.value, 10))}
                        className={`w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer ${isBuy ? 'accent-terracotta' : 'accent-sage'}`}
                      />
                    </div>
                  )}

                  <div className="bg-gray-50 p-3 rounded-lg text-center mb-5 border border-gray-200">
                    <p className="text-xs text-gray-500 font-bold mb-1">{isBuy ? 'つかう コイン の ごうけい' : 'もらえる コイン の ごうけい'}</p>
                    <p className="text-3xl font-bold text-bluegrey">
                      {total.toLocaleString()} <span className="text-sm">C</span>
                    </p>
                    <p className="text-[11px] text-gray-500 font-bold mt-1">
                      {isBuy ? 'のこる' : 'ふえて'} コイン: {(isBuy ? coin - total : coin + total).toLocaleString()} C
                    </p>
                  </div>

                  <div className="flex gap-3">
                    <button
                      onClick={closeTradeModal}
                      className="flex-1 bg-gray-300 text-gray-700 py-3 rounded-xl font-bold active:scale-95 transition-transform"
                    >やめる</button>
                    <button
                      onClick={isBuy ? executeBuy : executeSell}
                      className={`flex-1 ${accentClass} text-white py-3 rounded-xl font-bold active:scale-95 transition-transform`}
                    >{isBuy ? 'この数で 買う' : 'ほんとうに うる'}</button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* ★追加：全てのかぶを売る時の確認モーダル */}
          {sellAllModalOpen && (
            <div className="absolute inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm relative animate-pop-in border-4 border-mustard">
                <h3 className="text-2xl font-bold text-center text-yellow-600 mb-4">ぜんぶ 売る！</h3>
                <div className="bg-yellow-50 p-4 rounded-xl mb-6 border border-yellow-200 text-center">
                  <p className="text-gray-700 font-bold leading-relaxed">
                    もっている <span className="text-red-500">すべての かぶ</span> を<br/>
                    いまの ねだんで 売ります。<br/><br/>
                    ほんとうに いいですか？
                  </p>
                </div>
                <div className="flex gap-3">
                  <button 
                    onClick={() => setSellAllModalOpen(false)}
                    className="flex-1 bg-gray-300 text-gray-700 py-3 rounded-xl font-bold active:scale-95 transition-transform"
                  >やめる</button>
                  <button 
                    onClick={executeSellAll}
                    className="flex-1 bg-mustard text-bluegrey py-3 rounded-xl font-bold active:scale-95 transition-transform"
                  >ぜんぶ うる</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
